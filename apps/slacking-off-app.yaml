apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-slacking-off
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SentimentalK/k3s-homelab.git
    targetRevision: master
    path: apps/slacking-off
  destination:
    server: https://kubernetes.default.svc
    namespace: slacking-off
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
