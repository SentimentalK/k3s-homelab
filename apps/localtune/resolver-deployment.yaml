apiVersion: apps/v1
kind: Deployment
metadata:
  name: localtune-resolver
  namespace: localtune
  labels:
    app: localtune-resolver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localtune-resolver
  template:
    metadata:
      labels:
        app: localtune-resolver
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: mtl0
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: resolver
          image: ghcr.io/sentimentalk/localtune-resolver
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8787
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8787
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Node needs a writable /tmp under a read-only root filesystem.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
