apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: rag-experiment
  labels:
    app: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: rag-experiment
      containers:
        - name: frontend
          image: ghcr.io/sentimentalk/rag-experiment-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      nodeSelector:
        kubernetes.io/hostname: mtl3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: rag-experiment
  labels:
    app: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: frontend
  type: ClusterIP
