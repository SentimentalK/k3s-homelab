apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-experiment
  namespace: rag-experiment
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    argocd.argoproj.io/sync-wave: "2"
spec:
  ingressClassName: traefik
  rules:
    - host: rag.sentimentalk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  tls:
    - hosts:
        - rag.sentimentalk.com
      secretName: rag-experiment-tls
