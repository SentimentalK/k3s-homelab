apiVersion: batch/v1
kind: Job
metadata:
  name: rag-db-migrate
  namespace: rag-experiment
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: rag-experiment
      restartPolicy: Never
      containers:
        - name: database-migrate
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              psql "$DATABASE_URL" \
                -v ON_ERROR_STOP=1 \
                -f /migrations/001_enable_pgvector.sql

              psql "$DATABASE_URL" \
                -v ON_ERROR_STOP=1 \
                -f /migrations/002_create_base_tables.sql

              psql "$DATABASE_URL" \
                -v ON_ERROR_STOP=1 \
                -f /migrations/003_create_experiment_tables.sql
          env:
            - name: DATABASE_URL
              value: "postgresql://rag_user:rag_password@rag-database:5432/sherlock_rag"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: migrations
          configMap:
            name: database-migrations-config
      nodeSelector:
        kubernetes.io/hostname: mtl3
