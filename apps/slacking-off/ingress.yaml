apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: slacking-off
  namespace: slacking-off
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: slacking-off.mainstayx.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slacking-off
                port:
                  name: http
  tls:
    - hosts:
        - slacking-off.mainstayx.com
      secretName: slacking-off-tls
