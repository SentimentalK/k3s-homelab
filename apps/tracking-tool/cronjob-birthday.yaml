apiVersion: batch/v1
kind: CronJob
metadata:
  name: tracking-tool-birthday
  namespace: tracking-tool
  labels:
    app: tracking-tool
spec:
  timeZone: Asia/Shanghai
  schedule: "0 9 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 30
  failedJobsHistoryLimit: 14
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: tracking-tool
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: tracking-tool-birthday
              image: ghcr.io/sentimentalk/tracking-tool:latest
              imagePullPolicy: Always
              command: ["python", "main.py", "--app", "birthday"]
              envFrom:
                - secretRef:
                    name: tracking-tool-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
