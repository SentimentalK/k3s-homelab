apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceo-web
  namespace: ceo
  labels:
    app: ceo-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ceo-web
  template:
    metadata:
      labels:
        app: ceo-web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: mtl0
      containers:
        - name: ceo-web
          image: ghcr.io/sentimentalk/ceo-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
