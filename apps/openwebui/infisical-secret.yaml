apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: openwebui-secrets
  namespace: openwebui
spec:
  infisicalAuthRef:
    name: k3s-prod-auth
    namespace: infisical-operator

  syncOptions:
    refreshInterval: 1m

  sources:
    - projectSlug: ai-w7t-q
      environmentSlug: prod
      secretPath: /openwebui

  targets:
    - name: openwebui-secrets
      namespace: openwebui
      kind: Secret
      creationPolicy: Owner
