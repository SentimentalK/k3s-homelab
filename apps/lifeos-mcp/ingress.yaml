apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lifeos-mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: agent.sentimentalk.com
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: lifeos-mcp
                port:
                  number: 3000
  tls:
    - hosts:
        - agent.sentimentalk.com
      secretName: lifeos-mcp-tls
