apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifeos-mcp
  labels:
    app: lifeos-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lifeos-mcp
  template:
    metadata:
      labels:
        app: lifeos-mcp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: mtl0
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lifeos-mcp
          image: ghcr.io/sentimentalk/lifeos-mcp:latest
          imagePullPolicy: Always
          env:
            - name: LIFEOS_DATA_ROOT
              value: /data
            - name: LIFEOS_REMOTE
              value: git@github.com:SentimentalK/LifeOS.git
            - name: LIFEOS_BRANCH
              value: main
            - name: LIFEOS_SSH_KEY_PATH
              value: /var/run/secrets/lifeos-git/ssh-privatekey
            - name: LIFEOS_KNOWN_HOSTS_PATH
              value: /etc/lifeos-git/known_hosts
            - name: BIND_HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lifeos-mcp-auth
                  key: api-key
            - name: ALLOWED_HOSTS
              value: agent.sentimentalk.com,localhost,127.0.0.1
          ports:
            - name: mcp
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: 3000
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: git-key
              mountPath: /var/run/secrets/lifeos-git
              readOnly: true
            - name: git-known-hosts
              mountPath: /etc/lifeos-git
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          hostPath:
            path: /home/ubuntu/codes/lifeos-mcp
            type: Directory
        - name: git-key
          secret:
            secretName: lifeos-git
            defaultMode: 0440
        - name: git-known-hosts
          configMap:
            name: lifeos-git-known-hosts
            defaultMode: 0444
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
