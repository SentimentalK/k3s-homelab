# Do not apply or commit real secret values. Render this file with real values,
# pipe it through kubeseal for the cluster, and add only the resulting
# SealedSecret resources to kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: lifeos-git
  namespace: lifeos-mcp
type: kubernetes.io/ssh-auth
stringData:
  ssh-privatekey: REPLACE_WITH_REPOSITORY_SCOPED_DEPLOY_PRIVATE_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: lifeos-tunnel
  namespace: lifeos-mcp
type: Opaque
stringData:
  tunnel-id: tunnel_REPLACE_WITH_32_LOWERCASE_HEX_CHARACTERS
  api-key: REPLACE_WITH_RUNTIME_API_KEY
