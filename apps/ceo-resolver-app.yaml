apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-ceo-resolver
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SentimentalK/k3s-homelab.git
    targetRevision: master
    path: apps/ceo-resolver
  destination:
    server: https://kubernetes.default.svc
    namespace: ceo
