apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-radar
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: radar.sentimentalk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
  tls:
    - hosts:
        - radar.sentimentalk.com
      secretName: ai-radar-tls
