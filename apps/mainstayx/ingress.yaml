apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mainstayx
  namespace: mainstayx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: www.mainstayx.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mainstayx
                port:
                  number: 8080
  tls:
    - hosts:
        - www.mainstayx.com
      secretName: mainstayx-tls
