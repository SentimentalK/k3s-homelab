apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ceo-state-mcp
  namespace: ceo-state-mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: ceo.sentimentalk.com
      http:
        paths:
          - path: /audit
            pathType: Prefix
            backend:
              service:
                name: ceo-web
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ceo-state-mcp
                port:
                  number: 3000
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: ceo-state-mcp
                port:
                  number: 3000
  tls:
    - hosts:
        - ceo.sentimentalk.com
      secretName: ceo-state-mcp-tls
